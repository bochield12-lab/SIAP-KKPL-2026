<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi KKPL Sukowiyono 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-custom {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
  </style>
</head>
<body class="bg-custom min-h-screen text-slate-100 flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="p-6 text-center border-b border-slate-700/50 bg-slate-900/40 backdrop-blur-md sticky top-0 z-10">
    <h1 class="text-2xl font-bold tracking-wide text-emerald-400">SIAP SUKOWIYONO</h1>
    <p class="text-xs text-slate-400 mt-1">Sistem Informasi & Absensi Presensi KKPL 2026</p>
  </header>

  <!-- Main Content -->
  <main class="p-4 max-w-md mx-auto w-full flex-grow flex flex-col justify-center">
    <div class="bg-slate-800/80 backdrop-blur-lg border border-slate-700 p-6 rounded-2xl shadow-xl">
      
      <!-- Alert Message -->
      <div id="statusAlert" class="hidden mb-4 p-3 rounded-xl text-sm font-medium border flex items-center gap-2"></div>

      <form id="presensiForm" onsubmit="submitPresensi(event)" class="space-y-4">
        
        <!-- Dropdown Nama -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nama Anggota</label>
          <div class="relative">
            <select id="namaSelect" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 appearance-none text-slate-200">
              <option value="" disabled selected>Pilih Nama Kamu...</option>
            </select>
            <i class="fa-solid font-bold fa-chevron-down absolute right-4 top-3.5 text-slate-400 text-xs pointer-events-none"></i>
          </div>
        </div>

        <!-- Status Kehadiran -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Status Kehadiran</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-900/50 cursor-pointer hover:bg-slate-700/50 transition">
              <input type="radio" name="status" value="Hadir Posko" checked onchange="toggleAlasan(false)" class="text-emerald-500 focus:ring-0">
              <span class="ml-2 text-xs font-medium">Hadir Posko</span>
            </label>
            <label class="flex items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-900/50 cursor-pointer hover:bg-slate-700/50 transition">
              <input type="radio" name="status" value="Kegiatan Luar Desa" onchange="toggleAlasan(true)" class="text-emerald-500 focus:ring-0">
              <span class="ml-2 text-xs font-medium">Luar Desa</span>
            </label>
          </div>
        </div>

        <!-- Input Alasan (Luar Desa) -->
        <div id="alasanBox" class="hidden">
          <label class="block text-xs font-semibold uppercase tracking-wider text-amber-400 mb-1">Keterangan / Alasan Luar Desa</label>
          <textarea id="alasanInput" rows="2" placeholder="Contoh: Izin urusan kampus / survei ke kota" class="w-full bg-slate-900/80 border border-amber-500/50 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-400 text-slate-200"></textarea>
        </div>

        <!-- Indikator GPS / Jarak -->
        <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-700/60 text-xs space-y-1">
          <div class="flex justify-between items-center text-slate-400">
            <span>Koordinat Posko:</span>
            <span class="font-mono text-slate-300">-8.0645, 111.9012</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-slate-400">Jarak Kamu:</span>
            <span id="distanceText" class="font-semibold text-emerald-400">Mengecek Lokasi...</span>
          </div>
        </div>

        <!-- Tombol Submit -->
        <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fa-solid fa-location-crosshairs"></i>
          <span>Kirim Presensi Sekarang</span>
        </button>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-800">
    &copy; 2026 KKPL Sukowiyono - STAI Diponegoro Tulungagung
  </footer>

  <!-- Script Logika Frontend -->
  <script>
    // URL Web App Apps Script milikmu
    const API_URL = "https://script.google.com/macros/s/AKfycbyS98kG9SAnzC1_f6ZeYXw8wGNJHT3Ni9rD-ALpSmPucBdhcAMMuqXRl7obq_Jjz3xu/exec";
    
    // Titik Posko Desa Sukowiyono
    const POSKO_LAT = -8.064567;
    const POSKO_LNG = 111.901234;
    const MAX_RADIUS_KM = 2.0;

    let userLat = null;
    let userLng = null;
    let currentDistance = null;

    // Load Daftar Nama
    window.addEventListener("DOMContentLoaded", async () => {
      fetchNamaList();
      initGPS();
    });

    async function fetchNamaList() {
      try {
        const response = await fetch(`${API_URL}?action=getNama`);
        const data = await response.json();
        const select = document.getElementById("namaSelect");
        
        if (data.status === "success" && Array.isArray(data.data)) {
          data.data.forEach(nama => {
            const opt = document.createElement("option");
            opt.value = nama;
            opt.textContent = nama;
            select.appendChild(opt);
          });
        }
      } catch (err) {
        showAlert("Gagal memuat daftar nama dari server.", "error");
      }
    }

    function initGPS() {
      const distText = document.getElementById("distanceText");
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            currentDistance = calculateDistance(userLat, userLng, POSKO_LAT, POSKO_LNG);
            
            distText.textContent = `${currentDistance.toFixed(2)} km dari posko`;
            if (currentDistance <= MAX_RADIUS_KM) {
              distText.className = "font-semibold text-emerald-400";
            } else {
              distText.className = "font-semibold text-amber-400";
            }
          },
          (err) => {
            distText.textContent = "Gagal akses GPS!";
            distText.className = "font-semibold text-rose-400";
          },
          { enableHighAccuracy: true }
        );
      } else {
        distText.textContent = "Browser tidak mendukung GPS";
      }
    }

    // Formula Haversine menghitung jarak GPS dalam KM
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radius bumi KM
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function toggleAlasan(isLuarDesa) {
      const box = document.getElementById("alasanBox");
      const input = document.getElementById("alasanInput");
      if (isLuarDesa) {
        box.classList.remove("hidden");
        input.setAttribute("required", "true");
      } else {
        box.classList.add("hidden");
        input.removeAttribute("required");
        input.value = "";
      }
    }

    async function submitPresensi(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      const nama = document.getElementById("namaSelect").value;
      const status = document.querySelector('input[name="status"]:checked').value;
      const alasan = document.getElementById("alasanInput").value;

      if (!userLat || !userLng) {
        showAlert("Lokasi GPS belum ditemukan. Izinkan akses lokasi di HP kamu!", "error");
        return;
      }

      // Validasi Radius 2 KM
      if (status === "Hadir Posko" && currentDistance > MAX_RADIUS_KM) {
        showAlert(`Posisi kamu (${currentDistance.toFixed(2)} km) di luar radius posko (Maks 2 km). Pilih status 'Luar Desa' jika ada kegiatan di luar.`, "warning");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Mengirim Data...</span>`;

      const payload = {
        nama: nama,
        status: status,
        alasan: alasan,
        latitude: userLat,
        longitude: userLng,
        jarakKm: currentDistance.toFixed(2)
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === "success") {
          showAlert("Presensi berhasil dicatat! Terima kasih.", "success");
          document.getElementById("presensiForm").reset();
          toggleAlasan(false);
        } else {
          showAlert(result.message || "Gagal menyimpan presensi.", "error");
        }
      } catch (err) {
        showAlert("Terjadi kesalahan koneksi ke server.", "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i><span>Kirim Presensi Sekarang</span>`;
      }
    }

    function showAlert(msg, type) {
      const alert = document.getElementById("statusAlert");
      alert.classList.remove("hidden", "bg-emerald-900/50", "border-emerald-500", "text-emerald-200", "bg-rose-900/50", "border-rose-500", "text-rose-200", "bg-amber-900/50", "border-amber-500", "text-amber-200");

      if (type === "success") {
        alert.classList.add("bg-emerald-900/50", "border-emerald-500", "text-emerald-200");
        alert.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
      } else if (type === "warning") {
        alert.classList.add("bg-amber-900/50", "border-amber-500", "text-amber-200");
        alert.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>${msg}</span>`;
      } else {
        alert.classList.add("bg-rose-900/50", "border-rose-500", "text-rose-200");
        alert.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${msg}</span>`;
      }
    }
  </script>
</body>
</html>
